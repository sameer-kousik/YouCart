<!DOCTYPE html>
<html>
<head>
    <title>YouCart</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Welcome to YouCart!</h1>
    <p>Loading...</p>
    <div id="auth-section">
        <button id="loginBtn">Login with Kroger</button>
    </div>
    <div id="location-section" style="display:none;">
        <input type="text" id="zipCode" placeholder="Enter ZIP Code">
        <button id="searchLocationsBtn">Search Locations</button>
        <div id="locationsList"></div>
        <button id="saveLocationBtn" style="display:none;">Save Location</button> <!-- Will be removed/repurposed in JS -->
    </div>
    <div id="current-location-display" style="margin-top: 10px; padding: 5px; border: 1px solid #ddd; display: none;">
        <strong>Current Store:</strong> <span id="selectedLocationName">None selected</span>
    </div>
    <div id="youtube-section" style="display:none;">
        <button id="analyzeVideoBtn">Analyze Video for Ingredients</button>
    </div>
    <div id="ingredients-section" style="display:none;">
        <h2>Ingredients:</h2>
        <ul id="ingredientsList"></ul>
        <div id="selection-controls" style="margin-top: 5px; margin-bottom: 5px;">
            <button id="selectAllBtn" style="margin-right: 5px;">Select All</button>
            <button id="deselectAllBtn">Deselect All</button>
        </div>
        <button id="addToCartBtn">Add Selected to Cart</button> <!-- Text already updated in previous task -->
    </div>
    <div id="status-messages"></div>
    <script src="popup.js"></script>
</body>
</html>
